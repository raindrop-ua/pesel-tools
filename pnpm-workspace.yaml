overrides:
  # Angular pins Vite exactly; keep its dev server on the patched release too.
  "@angular/build>vite": ^8.3.5

# Allow the required esbuild setup and Cypress binary installation.
# Optional native accelerators use their packaged binaries or JS fallbacks.
allowBuilds:
  "@parcel/watcher": false
  cypress: true
  esbuild: true
  fsevents: false
  lmdb: false
  msgpackr-extract: false
