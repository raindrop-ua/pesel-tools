<app-card>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <p class="mb-2 text-xl">Enter birthdate and sex:</p>
    <app-birthday-input [formGroup]="birthdayGroup" />
    @if (!birthdayGroup.valid) {
      <p class="my-2" role="status" aria-live="polite">
        Please provide a valid birthdate.
      </p>
    }
    <button
      class="my-4"
      app-button="primary"
      type="submit"
      [disabled]="!birthdayGroup.valid"
    >
      Generate
    </button>
    &nbsp;<span> or </span>&nbsp;
    <button
      class="my-4"
      app-button="primary"
      type="button"
      (click)="generateRandomPesel()"
    >
      Generate Random
    </button>
    <br />
    @let pesels = peselList();
    @if (pesels.length) {
      <p class="mb-2 text-xl">
        Generated PESEL{{ pesels.length > 1 ? "s" : "" }}:
      </p>
      <app-pesel-output [data]="pesels" />
      <button
        class="my-4"
        app-button="primary"
        type="button"
        (click)="clearList()"
      >
        Clear List
      </button>
    }
  </form>
</app-card>
