<app-card>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <p class="mb-4 text-lg font-semibold">Enter birthdate and sex:</p>
    <app-birthday-input [formGroup]="birthdayGroup" />
    @if (!birthdayGroup.valid) {
      <p class="mt-3 text-sm text-muted" role="status" aria-live="polite">
        Please provide a valid birthdate.
      </p>
    }
    <div
      class="my-6 flex flex-col gap-3 sm:flex-row sm:flex-wrap sm:items-center"
    >
      <button
        app-button="primary"
        type="submit"
        [disabled]="!birthdayGroup.valid"
      >
        Generate
      </button>
      <span class="hidden text-sm text-muted sm:inline">or</span>
      <button
        app-button="secondary"
        type="button"
        (click)="generateRandomPesel()"
      >
        Generate Random
      </button>
    </div>
    @let pesels = peselList();
    @if (pesels.length) {
      <p class="mb-4 text-lg font-semibold">
        Generated PESEL{{ pesels.length > 1 ? "s" : "" }}:
      </p>
      <app-pesel-output [data]="pesels" />
      <button
        class="mt-5"
        app-button="secondary"
        type="button"
        (click)="clearList()"
      >
        Clear List
      </button>
    }
  </form>
</app-card>
