<div
  class="relative flex rounded-xl border border-control-border bg-control-background px-3 py-2 text-control-text transition-[border-color,box-shadow] duration-200 focus-within:border-control-focus-border focus-within:ring-4 focus-within:ring-control-focus-shadow motion-reduce:transition-none"
>
  <input
    class="m-0 w-full min-w-0 flex-1 border-0 bg-transparent p-0 text-left text-xl leading-normal outline-none placeholder:font-normal placeholder:text-control-text placeholder:opacity-50 text-inherit"
    #nativeInput
    type="text"
    inputmode="numeric"
    pattern="[0-9]*"
    autocomplete="off"
    [attr.aria-label]="ariaLabel() || placeholder()"
    [placeholder]="placeholder()"
    [value]="value"
    [disabled]="disabled"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />
</div>
