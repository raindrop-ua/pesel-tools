<div
  class="relative flex min-h-[175px] flex-col rounded-xl border border-control-border bg-control-background pt-4 pr-12 pb-2 pl-4 text-control-text sm:min-h-0 sm:pr-32"
>
  @let peselsData = data();
  @if (peselsData.length > preview().length) {
    <p class="mb-3 text-sm text-muted">
      Showing {{ preview().length }} of {{ peselsData.length }}. Copy and
      download include all numbers.
    </p>
  }
  @for (item of preview(); track item) {
    <app-pesel-item [peselNumber]="item"></app-pesel-item>
  }
  <app-toolbar>
    @if (peselsData.length <= 1) {
      <app-goto-parse-button [pesel]="peselsData[0]" />
    }
    <app-save-button [contentToSave]="peselList()" />
    <app-copy-json-button [contentToCopy]="peselList()" />
    <app-copy-button [contentToCopy]="peselList()" />
  </app-toolbar>
</div>
