@if (data(); as data) {
  <div
    class="relative flex flex-col rounded-xl border border-control-border bg-control-background py-4 pr-14 pl-4 text-lg leading-normal text-control-text"
  >
    <p>Birth Date: {{ data.birthDate | date: "dd.MM.y" }}</p>
    <p>Age: {{ data.age }}</p>
    <p class="flex gap-2">
      <span>Sex: {{ data.sex | titlecase }}</span>
      <svg
        [icon]="data.sex"
        width="24"
        height="24"
        stroke="currentColor"
        stroke-width="2"
      ></svg>
    </p>
    <p>Serial number: {{ data.serial }}</p>
    <app-toolbar>
      <app-copy-button [contentToCopy]="dataString()" />
    </app-toolbar>
  </div>
}
