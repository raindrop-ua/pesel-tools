<app-section>
  <app-masthead />
  <app-pesel-of-the-moment />
  <div class="mb-8 grid gap-4 sm:grid-cols-2">
    <a class="tool-link" [routerLink]="['/', AppRouteEnum.Batch]">
      <span class="mb-2 block text-xl font-bold"
        >Check a whole list <span aria-hidden="true">↗</span></span
      >
      <span class="block text-sm leading-relaxed text-muted"
        >Validate CSV files, find duplicates and export the results.</span
      >
    </a>
    <a class="tool-link" [routerLink]="['/', AppRouteEnum.TestData]">
      <span class="mb-2 block text-xl font-bold"
        >Put your tests to work <span aria-hidden="true">↗</span></span
      >
      <span class="block text-sm leading-relaxed text-muted"
        >Ready-made datasets for dates, checksums and malformed input.</span
      >
    </a>
  </div>
  <app-card>
    <app-what-is-pesel />
  </app-card>
  <app-card>
    <app-disclaimer />
  </app-card>
</app-section>
