@defer (on idle) {
  <div
    role="group"
    aria-label="Theme toggle"
    class="inline-flex bg-header-background"
  >
    @for (theme of themes; track theme.id) {
      <button
        class="group relative flex cursor-pointer items-center justify-center rounded-full p-2 text-header-text transition-colors duration-300 hover:bg-control-background hover:text-header-link-active aria-pressed:bg-control-background aria-pressed:text-header-link-active motion-reduce:transition-none"
        type="button"
        (click)="setTheme(theme.id)"
        [attr.aria-pressed]="currentTheme() === theme.id"
        [title]="theme.label"
      >
        <svg
          class="size-6 min-w-6 stroke-[1.5] transition-[stroke-width,color] duration-300 group-hover:stroke-2 motion-reduce:transition-none"
          [icon]="theme.icon"
          width="24"
          height="24"
          stroke="currentColor"
          stroke-width="2"
        ></svg>
        <span class="sr-only">{{ theme.label }}</span>
      </button>
    }
  </div>
} @placeholder {
  <div
    class="inline-flex rounded-lg border border-header-text/15 bg-header-background"
  >
    @for (theme of themes; track theme.id) {
      <div
        class="size-10 rounded-lg bg-control-background motion-safe:animate-pulse"
      ></div>
    }
  </div>
}
