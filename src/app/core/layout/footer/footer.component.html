<footer
  class="flex h-13 items-center justify-between gap-6 border-t border-card-border bg-footer-background px-6 text-sm font-medium text-footer-text"
>
  <div class="flex">
    <p>&copy; 2025-{{ currentYear }}</p>
    <nav class="hidden sm:block">
      <menu class="ml-8 flex gap-4">
        @for (item of navigation; track item.path) {
          <li>
            <a
              class="text-sm text-footer-text no-underline decoration-1 underline-offset-4 hover:text-footer-link-active hover:underline aria-[current=page]:text-footer-link-active aria-[current=page]:underline"
              [routerLink]="item.path"
              [attr.aria-current]="isLinkActive(item.path) ? 'page' : null"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </menu>
    </nav>
  </div>
  <div class="flex">
    Coded with
    <svg
      class="ml-2 text-footer-attention"
      icon="heart"
      width="24"
      height="24"
      stroke="currentColor"
      stroke-width="2"
    ></svg>
  </div>
</footer>
