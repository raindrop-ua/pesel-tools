<header
  class="relative z-10 flex h-16 items-center justify-between gap-4 bg-header-background px-6"
>
  <div class="flex items-center gap-4">
    <button
      class="flex cursor-pointer flex-col gap-1 border-0 bg-transparent p-1.5 md:hidden"
      type="button"
      (click)="onMenuToggle()"
      aria-label="Toggle menu"
      aria-controls="mobile-navigation"
      [attr.aria-expanded]="menuOpen()"
    >
      <span class="h-0.5 w-6 bg-header-text"></span>
      <span class="h-0.5 w-6 bg-header-text"></span>
      <span class="h-0.5 w-6 bg-header-text"></span>
    </button>
    @if (menuOpen()) {
      <nav
        id="mobile-navigation"
        class="absolute inset-x-0 top-16 z-100 bg-header-background-secondary p-4 shadow-lg backdrop-blur-sm md:hidden"
        aria-label="Mobile"
      >
        <ul class="flex flex-col gap-4 md:flex-row">
          @for (item of navigation; track item.path) {
            <li>
              <a
                class="mb-3 text-xl font-normal text-header-text no-underline aria-[current=page]:text-header-link-active aria-[current=page]:underline decoration-2 underline-offset-5"
                [routerLink]="item.path"
                [attr.aria-current]="isLinkActive(item.path) ? 'page' : null"
                (click)="onMenuClose()"
              >
                {{ item.label }}
              </a>
            </li>
          }
        </ul>
      </nav>
    }
    <div class="text-lg font-extrabold text-header-text sm:mr-6 sm:text-3xl">
      <a
        class="block text-header-text no-underline"
        [routerLink]="[AppRouteEnum.Home]"
      >
        PESEL Tools
      </a>
    </div>
    <nav class="hidden md:block" aria-label="Main">
      <ul class="flex flex-col gap-4 md:flex-row">
        @for (item of navigation; track item.path) {
          <li>
            <a
              class="block text-xl font-bold text-header-text no-underline decoration-3 underline-offset-5 transition-[text-underline-offset] duration-300 hover:underline hover:underline-offset-8 aria-[current=page]:text-header-link-active aria-[current=page]:underline motion-reduce:transition-none"
              [routerLink]="item.path"
              [attr.aria-current]="isLinkActive(item.path) ? 'page' : null"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>
  </div>
  <app-theme-switcher />
</header>
@if (menuOpen()) {
  <button
    type="button"
    class="fixed inset-0 z-5 border-0 bg-black/50 p-0 backdrop-blur-sm md:hidden"
    aria-label="Close menu"
    (click)="onMenuClose()"
  ></button>
}
