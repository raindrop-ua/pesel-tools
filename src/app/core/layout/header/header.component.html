<header
  class="relative z-10 flex h-16 items-center justify-between gap-4 border-b border-card-border bg-header-background px-6"
>
  <div class="flex items-center gap-4">
    <button
      class="flex cursor-pointer flex-col gap-1 border-0 bg-transparent p-1.5 md:hidden"
      type="button"
      (click)="onMenuToggle()"
      aria-label="Toggle menu"
      aria-controls="mobile-navigation"
      [attr.aria-expanded]="menuOpen()"
    >
      <span class="h-0.5 w-6 bg-header-text"></span>
      <span class="h-0.5 w-6 bg-header-text"></span>
      <span class="h-0.5 w-6 bg-header-text"></span>
    </button>
    @if (menuOpen()) {
      <nav
        id="mobile-navigation"
        class="absolute inset-x-0 top-16 z-100 rounded-b-3xl border-b border-card-border bg-header-background-secondary p-6 shadow-lg shadow-main-text/10 backdrop-blur-sm md:hidden"
        aria-label="Mobile"
      >
        <ul class="flex flex-col gap-1 md:flex-row">
          @for (item of navigation; track item.path) {
            <li>
              <a
                class="block rounded-xl px-4 py-3 text-lg font-semibold text-header-text no-underline hover:bg-control-background aria-[current=page]:bg-control-background aria-[current=page]:text-header-link-active"
                [routerLink]="item.path"
                [attr.aria-current]="isLinkActive(item.path) ? 'page' : null"
                (click)="onMenuClose()"
              >
                {{ item.label }}
              </a>
            </li>
          }
        </ul>
      </nav>
    }
    <div class="text-lg font-extrabold text-header-text sm:mr-3 sm:text-2xl">
      <a
        class="block text-header-text no-underline"
        [routerLink]="[AppRouteEnum.Home]"
      >
        <span class="text-header-link-active">PESEL</span> Tools
      </a>
    </div>
    <nav class="hidden md:block" aria-label="Main">
      <ul class="flex flex-col gap-1 md:flex-row">
        @for (item of navigation; track item.path) {
          <li>
            <a
              class="block rounded-xl px-3 py-2 text-base font-semibold text-header-text no-underline transition-colors duration-200 hover:bg-control-background hover:text-header-link-active aria-[current=page]:bg-control-background aria-[current=page]:text-header-link-active motion-reduce:transition-none"
              [routerLink]="item.path"
              [attr.aria-current]="isLinkActive(item.path) ? 'page' : null"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>
  </div>
  <app-theme-switcher />
</header>
@if (menuOpen()) {
  <button
    type="button"
    class="fixed inset-0 z-5 border-0 bg-black/50 p-0 backdrop-blur-sm md:hidden"
    aria-label="Close menu"
    (click)="onMenuClose()"
  ></button>
}
