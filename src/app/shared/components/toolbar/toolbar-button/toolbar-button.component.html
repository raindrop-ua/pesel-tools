<button
  type="button"
  class="inline-flex size-8 cursor-pointer items-center justify-center rounded-lg border border-tool-border bg-tool-background p-0 text-tool-text transition-colors duration-200 enabled:hover:border-tool-hover-border enabled:hover:bg-tool-hover-background enabled:hover:text-tool-hover-text disabled:cursor-default disabled:opacity-60 motion-reduce:transition-none"
  [disabled]="disabled()"
  [title]="titleToShow()"
  (click)="handleClick()"
  aria-live="polite"
>
  <span class="sr-only">{{ srTextToShow() }}</span>
  <svg
    class="size-5"
    [icon]="iconToShow()"
    width="24"
    height="24"
    stroke="currentColor"
    stroke-width="2"
  ></svg>
</button>
